name: velocity

services:
  velocity:
    build: .
    image: ${VELOCITY_IMAGE:-velocity:latest}
    container_name: velocity
    restart: unless-stopped
    ports:
      - "8097:8097"
    environment:
      - TZ=America/New_York
    volumes:
      # On Isengard: /mnt/user/appdata/velocity/data. Locally: ./appdata.
      - ${VELOCITY_DATA:-./appdata}:/data
    command: ["velocity", "serve", "--host", "0.0.0.0", "--port", "8097", "--rebuild-hours", "6", "12"]
