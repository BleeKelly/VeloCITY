<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VeloCITY</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="icon" href="/static/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#8a5530">
  <meta name="apple-mobile-web-app-title" content="VeloCITY">
  <link rel="stylesheet" href="/static/app.css">
  <script>
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand" data-link>
      <img class="brand-mark" src="/static/logo.svg" alt="" width="34" height="34">
      <span class="wordmark" aria-label="VeloCITY">V<b>elo</b>CITY</span>
      <span id="league-tag" class="league-tag" hidden></span>
    </a>
    <nav class="nav">
      <a href="/" data-link data-nav="ratings">Ratings</a>
      <a href="/games" data-link data-nav="games">Games</a>
      <a href="/season" data-link data-nav="season">Seasons</a>
      <a href="/chart" data-link data-nav="chart">Elo × V-City</a>
      <a href="/rules" data-link data-nav="rules">Rules</a>
      <a href="/glossary" data-link data-nav="glossary">Glossary</a>
      <label class="team-pick">
        <span class="sr-only">Jump to team</span>
        <select id="team-select"><option value="">Teams</option></select>
      </label>
    </nav>
    <div class="topbar-right">
      <nav id="league-switch" class="league-switch" aria-label="Leagues" hidden></nav>
      <span id="status-pill" class="pill">Loading…</span>
      <a class="icon-btn gh-link" href="https://github.com/BleeKelly/VeloCITY" target="_blank" rel="noopener" aria-label="VeloCITY on GitHub" title="Source on GitHub">
        <svg viewBox="0 0 16 16" width="17" height="17" fill="currentColor" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
      </a>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle light or dark theme">◐</button>
    </div>
  </header>
  <section id="slate" class="slate" aria-label="This week's games"></section>
  <main id="app" class="app" tabindex="-1"></main>
  <div id="tooltip" class="tooltip" role="status" hidden></div>
  <footer class="footer">
    Every run, pass, punt and field goal is a one-play game between an offense and a defense. <span id="data-credit">Data: nflverse play-by-play (nightly) and ESPN (live, provisional).</span>
    <a href="https://github.com/BleeKelly/VeloCITY" target="_blank" rel="noopener">Source on GitHub</a>.
  </footer>
  <script src="/static/app.js"></script>
</body>
</html>
