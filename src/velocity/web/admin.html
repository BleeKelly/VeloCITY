<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VeloCITY admin</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="icon" href="/static/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#8a5530">
  <meta name="apple-mobile-web-app-title" content="VeloCITY">
  <link rel="stylesheet" href="/static/app.css">
  <script>
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <span class="brand">
      <img class="brand-mark" src="/static/logo.svg" alt="" width="34" height="34">
      <span class="wordmark" aria-label="VeloCITY">V<b>elo</b>CITY</span>
      <span class="chip">Rules admin</span>
    </span>
    <div class="topbar-right">
      <span id="status-pill" class="pill">Loading…</span>
      <a id="site-link" class="pill" href="/" target="_blank" rel="noopener" hidden>Open the site ↗</a>
    </div>
  </header>
  <main class="app admin" id="admin" tabindex="-1">
    <div class="page-head">
      <div>
        <h1>Scoring rules</h1>
        <div class="sub">Change how plays are scored and how the ratings move. Previews update as you type; saving rescores every season since 1999 (about a minute).</div>
      </div>
    </div>
    <div class="admin-grid">
      <form id="editor" class="admin-editor" autocomplete="off" novalidate></form>
      <aside class="admin-side" id="side"></aside>
    </div>
  </main>
  <div class="savebar" id="savebar" hidden>
    <span id="dirty-note">Unsaved changes</span>
    <span id="save-error" class="save-error" role="alert"></span>
    <button type="button" class="btn ghost" id="discard">Discard</button>
    <button type="button" class="btn primary" id="save">Save &amp; rescore</button>
  </div>
  <script src="/static/admin.js"></script>
</body>
</html>
