<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VeloCITY admin</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="icon" href="/static/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#8a5530">
  <meta name="apple-mobile-web-app-title" content="VeloCITY">
  <link rel="stylesheet" href="/static/app.css">
  <script>
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <span class="brand">
      <img class="brand-mark" src="/static/logo.svg" alt="" width="34" height="34">
      <span class="wordmark" aria-label="VeloCITY">V<b>elo</b>CITY</span>
      <span class="chip">Rules admin</span>
    </span>
    <div class="topbar-right">
      <span id="status-pill" class="pill">Loading…</span>
      <a id="site-link" class="pill" href="/" target="_blank" rel="noopener" hidden>Open the site ↗</a>
      <a class="icon-btn gh-link" href="https://github.com/BleeKelly/VeloCITY" target="_blank" rel="noopener" aria-label="VeloCITY on GitHub" title="Source on GitHub">
        <svg viewBox="0 0 16 16" width="17" height="17" fill="currentColor" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
      </a>
    </div>
  </header>
  <main class="app admin" id="admin" tabindex="-1">
    <div class="page-head">
      <div>
        <h1>Scoring rules</h1>
        <div class="sub">Change how plays are scored and how the ratings move. Previews update as you type; saving rescores every season since 1999 (about a minute).</div>
      </div>
    </div>
    <div class="admin-grid">
      <form id="editor" class="admin-editor" autocomplete="off" novalidate></form>
      <aside class="admin-side" id="side"></aside>
    </div>
  </main>
  <div class="savebar" id="savebar" hidden>
    <span id="dirty-note">Unsaved changes</span>
    <span id="save-error" class="save-error" role="alert"></span>
    <button type="button" class="btn ghost" id="discard">Discard</button>
    <button type="button" class="btn primary" id="save">Save &amp; rescore</button>
  </div>
  <script src="/static/admin.js"></script>
</body>
</html>
