<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="VeloCITY: a weasel spiking a football">
  <title>VeloCITY</title>
  <rect width="64" height="64" rx="14" fill="#f6eddf"/>
  <!-- ground and impact -->
  <path d="M38 58.5h22" stroke="#c9b79c" stroke-width="2" stroke-linecap="round"/>
  <g stroke="#e0662f" stroke-width="2.2" stroke-linecap="round">
    <path d="M43 55.5l-3.5-2.5"/>
    <path d="M51 51.5l0.2-4"/>
    <path d="M58.5 54l3-2.5"/>
  </g>
  <!-- tail, curling up behind -->
  <path d="M22 45c-9 2.5-14-3-12.5-11 .7-3.4 4.6-3.6 4.4.2-.3 5.2 2.6 7.6 8.6 6.4z" fill="#8a5530"/>
  <path d="M10.3 31.4c.9-2.4 4-2.3 4.2.3l-.2 2.1c-1.3-1-2.9-1.4-4.4-.7z" fill="#3b2414"/>
  <!-- hind legs -->
  <path d="M24.6 47.5l-2.6 9h5.6l2.2-8.4z" fill="#7a4a29"/>
  <path d="M30.6 47.8l2.2 8.7h5.4l-3.6-9.4z" fill="#7a4a29"/>
  <!-- long weasel body, leaning into the spike -->
  <path d="M23 49c-3.6-10 .6-23.6 9.6-29.4 5.4-3.4 10.8-.6 9.8 5.6-1.1 7.4-5.2 16.6-7.6 24.6z" fill="#8a5530"/>
  <path d="M28.4 46.5c-.8-7.6 2.2-16.2 7-21.2 2 1.8 2 6 .3 11.2-1.5 4.4-3.1 7.6-4 10.6z" fill="#f3dfbb"/>
  <!-- celebrating arm -->
  <path d="M33.6 24.5l-7.4-7.6" stroke="#8a5530" stroke-width="4.2" stroke-linecap="round"/>
  <circle cx="25.6" cy="16.2" r="2.3" fill="#7a4a29"/>
  <!-- spiking arm, follow-through toward the ball -->
  <path d="M38.6 26.5l8.6 11.6" stroke="#8a5530" stroke-width="4.4" stroke-linecap="round"/>
  <circle cx="47.8" cy="38.9" r="2.4" fill="#7a4a29"/>
  <!-- head: small, flat, pointed snout -->
  <path d="M34.4 16.2c-.4-6 5.2-9.4 10.6-7.6 3.8 1.2 7.6 3.6 9.2 6.2-1.4 2.4-5.4 3.8-9.6 4.4-5.2.8-9.8.4-10.2-3z" fill="#8a5530"/>
  <path d="M41 17.6c3.6.2 8.6-.6 12.2-2.2-1.6 2.2-5 3.4-8.6 4-2 .3-3.4-.6-3.6-1.8z" fill="#f3dfbb"/>
  <circle cx="38.2" cy="9.4" r="3" fill="#8a5530"/>
  <circle cx="38.3" cy="9.6" r="1.5" fill="#d9a97c"/>
  <circle cx="45.4" cy="12.6" r="1.35" fill="#1d120a"/>
  <circle cx="45.8" cy="12.2" r=".45" fill="#fff"/>
  <circle cx="54.4" cy="14.8" r="1.4" fill="#1d120a"/>
  <!-- the football, just hitting the turf -->
  <g transform="rotate(-28 51.5 51)">
    <ellipse cx="51.5" cy="51" rx="7.6" ry="4.6" fill="#7b3d1b"/>
    <path d="M45.4 49.2c1.2-.5 1.2 4.1 0 3.6M57.6 49.2c-1.2-.5-1.2 4.1 0 3.6" stroke="#f6eddf" stroke-width="1" fill="none"/>
    <path d="M48.6 51h5.8" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M49.6 49.9v2.2M51.5 49.9v2.2M53.4 49.9v2.2" stroke="#fff" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
