[project]
name = "velocity"
version = "0.1.0"
description = "VeloCITY: play-by-play Elo ratings for NFL offenses, defenses and coaching staffs"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "tzdata",
]

[project.scripts]
velocity = "velocity.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
